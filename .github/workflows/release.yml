name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package theme zip
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Create temp directory with correct folder name (no version suffix)
          mkdir -p /tmp/blaze-blocksy
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='README.md' --exclude='clients/' ./ /tmp/blaze-blocksy/
          # Create zip with correct inner folder name
          cd /tmp
          zip -r "blaze-blocksy-${VERSION}.zip" blaze-blocksy/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/blaze-blocksy-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
