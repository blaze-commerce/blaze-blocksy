name: Auto Version Bump

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    name: Bump patch version and tag
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version from latest tag
        id: bump
        run: |
          LATEST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [[ -z "$LATEST" ]]; then
            echo "No existing vX.Y.Z tags found, starting at v0.0.1"
            NEW="0.0.1"
          else
            CURRENT="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "VERSION=$NEW" >> "$GITHUB_OUTPUT"

      - name: Tag and push
        # Only the new tag is pushed. main itself is never written to. This
        # repo's branch ruleset requires all changes to main go through a
        # PR, so a direct git push to HEAD:main (what an earlier version of
        # this workflow did) is rejected with GH013. Tags under refs/tags
        # are not covered by that ruleset, so tagging the commit that was
        # just merged and pushing only the tag succeeds.
        id: tag
        env:
          VERSION: ${{ steps.bump.outputs.VERSION }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping (likely a rerun)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Trigger release workflow
        # GitHub does not start new workflow runs for a ref pushed using the
        # default GITHUB_TOKEN, so the tag push above will never fire
        # release.yml's push tags trigger on its own. Explicitly dispatch
        # it instead, targeting the tag we just pushed.
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.VERSION }}
        run: gh workflow run release.yml --ref "v$VERSION"
