name: Auto Version Bump

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    name: Bump patch version and tag
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip version]')"

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version in style.css
        id: bump
        run: |
          CURRENT=$(grep -m1 '^ Version:' style.css | sed -E 's/^ Version:\s*//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s/^ Version:.*/ Version:      $NEW/" style.css
          echo "VERSION=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "chore: bump version to $VERSION [skip version]"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
